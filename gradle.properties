org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# This machine has 14 GB and runs an Android emulator (~4 GB) alongside the
# build. Gradle's daemon defaults to living for 3 hours, which meant a 1.7 GB
# JVM plus a 1.1 GB Kotlin daemon sitting idle between builds and squeezing the
# emulator into swap. Ten minutes is long enough to keep consecutive builds warm.
org.gradle.daemon.idletimeout=600000
