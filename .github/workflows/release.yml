# A GitHub release for each app version whose signed APK is committed.
#
# The APK is built and signed on the owner's machine (the signing key and the
# bundled label pack never leave it) and committed as releases/NutritionScribe-<version>.apk
# with releases/NOTES-<version>.md, and the watch app as
# releases/NutritionScribe-Watch-<version>.apk when there is one (else the newest watch APK). On a push to main
# this makes release v<version> with those files attached, once. A "-test" version
# is a pre-release.
name: Release

on:
  push:
    branches: [main]
    paths: ["releases/**", "app/build.gradle.kts"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the committed APK for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          apk="releases/NutritionScribe-$ver.apk"
          watch="releases/NutritionScribe-Watch-$ver.apk"
          notes="releases/NOTES-$ver.md"
          tag="v$ver"
          if [ -z "$ver" ] || [ ! -f "$apk" ]; then
            echo "No APK committed for version '$ver'; nothing to release."; exit 0
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released."; exit 0
          fi
          args=(--target "$GITHUB_SHA" --title "Nutrition Scribe $ver")
          case "$ver" in *test*|*beta*) args+=(--prerelease) ;; esac
          if [ -f "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          files=("$apk")
          # The watch app isn't rebuilt when only the phone changes: attach the newest
          # one committed, under its own version's name.
          if [ ! -f "$watch" ]; then
            watch=$(ls releases/NutritionScribe-Watch-*.apk 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -n "$watch" ] && [ -f "$watch" ]; then files+=("$watch"); fi
          gh release create "$tag" "${files[@]}" "${args[@]}"
